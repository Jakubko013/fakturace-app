      var KLIC_DAT = "fakturace:data";

      document.getElementById("p-firma").textContent = DATA.nastaveni.firma.jmeno || "—";
      document.getElementById("p-klienti").textContent = DATA.klienti.length;
      document.getElementById("p-faktury").textContent = DATA.faktury.length;

      function razitko() {
        var d = new Date();
        function p(n) { return String(n).padStart(2, "0"); }
        return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
          "_" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
      }

      function ukazStav(trida, text) {
        var el = document.getElementById("stav");
        el.className = "stav " + trida;
        el.textContent = text;
      }

      document.getElementById("btn-import").addEventListener("click", function () {
        try {
          var stavajici = localStorage.getItem(KLIC_DAT);
          if (stavajici) {
            var potvrzeno = confirm(
              "V appce už nějaká data jsou. Přepsat je tímhle importem? " +
              "(Současná data se před tím zálohují, jde je obnovit v Nastavení.)"
            );
            if (!potvrzeno) return;
            localStorage.setItem("fakturace:zaloha:" + razitko(), stavajici);
          }
          localStorage.setItem(KLIC_DAT, JSON.stringify(DATA));
          ukazStav("uspech", "Hotovo — data jsou naimportovaná. Otevři appku a zkontroluj je.");
          document.getElementById("btn-import").style.display = "none";
          document.getElementById("btn-otevri").style.display = "block";
        } catch (err) {
          ukazStav("chyba", "Import se nepovedl: " + err.message);
        }
      });

      document.getElementById("btn-otevri").addEventListener("click", function () {
        location.href = "./index.html";
      });
    </script>
